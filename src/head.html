*{box-sizing:border-box}
html,body{height:100%}
html.big{font-size:118%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:.9375rem;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:17.5rem minmax(0,1fr) 22rem;grid-template-rows:auto minmax(0,1fr);height:100%}
.app.focus{grid-template-columns:minmax(0,1fr)}
.app.focus .rail{display:none}
.top{grid-column:1/-1;display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.6rem;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:1.15rem;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--ink3);letter-spacing:.04em}
.tools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.panes{display:none;gap:.25rem}
.who-sel{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--ink2)}
.who-sel select{min-width:7.5rem}
.who-sel.need select{outline:2px solid var(--warn);outline-offset:1px}
.here{display:flex;align-items:center;gap:0}
.av{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-size:.68rem;font-weight:700;background:hsl(var(--h) 42% var(--av-l));color:var(--av-fg);border:2px solid var(--surface);margin-left:-.4rem}
.av:first-child{margin-left:0}
.av.me{outline:2px solid var(--accent);outline-offset:0}
.av.more{background:var(--surface2);color:var(--ink2);border-color:var(--line)}

.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:.4rem;padding:.38rem .7rem;cursor:pointer;font-size:.82rem;font-weight:600;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:.22rem .5rem;font-size:.74rem}
.btn.link{border-color:transparent;background:transparent;color:var(--accent);padding:.2rem .3rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:.4rem;padding:.4rem .55rem;min-width:0}
textarea{resize:vertical;line-height:1.4}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
select{padding-right:.3rem}

.rail{background:var(--surface);overflow:auto;min-height:0}
.rail-l{border-right:1px solid var(--line);display:flex;flex-direction:column}
.rail-r{border-left:1px solid var(--line);padding:1rem;display:flex;flex-direction:column;gap:.9rem}
.agenda{padding:.6rem .5rem;flex:1}
.day-h{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:.7rem .6rem .3rem}
.sess{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;gap:.5rem;align-items:start;width:100%;text-align:left;border:0;background:transparent;border-radius:.4rem;padding:.42rem .6rem;cursor:pointer}
.sess:hover{background:var(--surface2)}
.sess .t{font-family:var(--f-mono);font-size:.72rem;color:var(--ink3);padding-top:.12rem}
.sess .n{font-weight:600;font-size:.86rem;line-height:1.25}
.sess[aria-current=true]{background:var(--accent-soft)}
.sess[aria-current=true] .n{color:var(--accent)}
.sess .tag{font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;border-radius:.25rem;padding:.08rem .3rem;background:var(--gain-soft);color:var(--gain);white-space:nowrap}
.sess .tag.lead{background:var(--accent);color:var(--accent-ink)}
.brk{display:flex;gap:.5rem;padding:.1rem .6rem;color:var(--ink3);font-size:.72rem;font-family:var(--f-mono)}
.brk::before{content:"";flex:0 0 3.4rem;border-bottom:1px dashed var(--line);margin-bottom:.45rem}
.prog{border-top:1px solid var(--line);padding:.8rem 1rem;display:flex;flex-direction:column;gap:.35rem}
.prog h3,.sec-h{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.pitem{display:flex;gap:.5rem;align-items:baseline;font-size:.78rem;color:var(--ink2)}
.tick{flex:0 0 .8rem;height:.8rem;border-radius:50%;border:1.5px solid var(--ink3);position:relative;top:.12rem}
.pitem.done .tick{background:var(--ok);border-color:var(--ok)}
.pitem.done .tick::after{content:"";position:absolute;left:.2rem;top:.02rem;width:.22rem;height:.45rem;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(40deg)}
.pitem.done{color:var(--ink)}
.pitem small{margin-left:auto;font-family:var(--f-mono);font-size:.68rem;color:var(--ink3);white-space:nowrap}

.stage{overflow:auto;min-height:0;padding:1.4rem clamp(1rem,2.6vw,2.2rem) 3rem;position:relative}
.stage-in{max-width:80rem;margin:0 auto;display:flex;flex-direction:column;gap:1.1rem}
.kick{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.kick b{color:var(--accent);font-weight:500}
.stage h1{font-family:var(--f-display);font-stretch:82%;font-weight:750;font-size:clamp(1.7rem,2.6vw,2.5rem);line-height:1.08;letter-spacing:-.005em;text-wrap:balance}
.head-row{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.react{display:flex;gap:.35rem;flex-wrap:nowrap}
.react:empty{display:none}
.react .btn{white-space:nowrap}
.brief{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.1rem}
.out{border-left:4px solid var(--gain);background:var(--gain-soft);padding:.7rem .9rem;border-radius:.2rem .5rem .5rem .2rem}
.out .sec-h{color:var(--gain);margin-bottom:.15rem}
.out p{font-weight:600;font-size:1rem;line-height:1.35}
.pts{display:flex;flex-direction:column;gap:.4rem;color:var(--ink2)}
.pts li{padding-left:1rem;position:relative}
.pts li::before{content:"";position:absolute;left:0;top:.62em;width:.4rem;height:.4rem;background:var(--accent);border-radius:1px;transform:rotate(45deg)}
.pts b{color:var(--ink)}
.pts a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:.15em}
.pts a:hover{text-decoration-thickness:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:.6rem;padding:1rem 1.1rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.75rem;min-width:0}
.panel h2{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.15rem;letter-spacing:.005em}
.panel .help{color:var(--ink3);font-size:.82rem}
.ph{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}
.meter{font-family:var(--f-mono);font-size:.78rem;color:var(--ink2);display:flex;align-items:center;gap:.5rem}
.meter .bar{width:6rem;height:.45rem;border-radius:1rem;background:var(--line2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meter.ok .bar i{background:var(--ok)}
.meter.over .bar i{background:var(--bad)}
.err{color:var(--bad);font-size:.8rem}
.muted{color:var(--ink3)}
.empty{border:1px dashed var(--line);border-radius:.5rem;padding:1rem;color:var(--ink3);font-size:.86rem;text-align:center}

.composer{display:flex;flex-direction:column;gap:.5rem}
.crow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.crow>*{flex:1 1 9rem}
.crow>.btn{flex:0 0 auto}
.feed{display:flex;flex-direction:column;gap:.5rem}
.note{border-left:3px solid var(--line);padding:.3rem .6rem;background:var(--surface2);border-radius:0 .4rem .4rem 0}
.note.ai{border-left-color:var(--gain)}
.note .meta{font-family:var(--f-mono);font-size:.7rem;color:var(--ink3);display:flex;gap:.5rem;align-items:center}
.note .meta .x{margin-left:auto}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:1rem;line-height:1;padding:.1rem .3rem;border-radius:.3rem}
.x:hover{color:var(--bad);background:var(--bad-soft)}

.stickies{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.7rem}
.sticky{background:var(--surface2);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:.4rem;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.35rem;min-width:0}
.sticky[data-tag="1"]{border-top-color:var(--gain)}
.sticky[data-tag="2"]{border-top-color:var(--ok)}
.sticky[data-tag="3"]{border-top-color:var(--bad)}
.sticky .tg{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.sticky p{white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500}
.sticky .xl{font-size:.8rem;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.sticky .xl i{font-style:normal;font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);display:block}
.sticky .ft{display:flex;align-items:center;gap:.4rem;margin-top:auto;font-size:.74rem;color:var(--ink3)}
.sticky .ft .x{margin-left:auto}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:1rem;padding:.1rem .55rem;cursor:pointer;font-family:var(--f-mono);font-size:.74rem;color:var(--ink2)}
.vote.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:.5rem;padding:.6rem;display:flex;flex-direction:column;gap:.5rem;min-height:12rem}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-family:var(--f-display);font-stretch:85%;font-size:.95rem;display:flex;justify-content:space-between;align-items:baseline;gap:.4rem}
.col h3 span{font-family:var(--f-mono);font-size:.74rem;color:var(--ink3)}
.col .def{font-size:.74rem;color:var(--ink3);line-height:1.3}
.col[data-k=close] h3{color:var(--accent)}
.col[data-k=complete] h3{color:var(--ok)}
.col[data-k=carry] h3{color:var(--gain)}
.col[data-k=stop] h3{color:var(--bad)}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:.4rem;padding:.4rem .5rem;display:flex;flex-direction:column;gap:.3rem;cursor:grab}
.gcard p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.86rem}
.gcard .ft{display:flex;gap:.3rem;align-items:center;font-size:.7rem;color:var(--ink3)}
.gcard select{font-size:.72rem;padding:.1rem .2rem;width:auto;max-width:7.5rem;margin-left:auto}

.fulltip{position:fixed;z-index:9999;max-width:min(34rem,calc(100vw - 1.5rem));max-height:60vh;overflow:hidden;padding:.6rem .75rem;border:1px solid var(--line);border-radius:.5rem;background:var(--surface);color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:.9rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}
.fulltip[hidden]{display:none}
.fulltip small{display:block;margin-bottom:.25rem;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.rocks{display:flex;flex-direction:column;gap:.8rem}
.rocks>.sec-h{padding-top:.4rem;border-top:1px solid var(--line)}
.rocks>.sec-h:first-child{border-top:0;padding-top:0}
.rock .rh .vote,.tg-vote{font-size:.8rem;padding:.25rem .7rem;white-space:nowrap}
tr.dropped{opacity:.5}
tr.dropped td input{text-decoration:line-through}
.skipb{border:1px solid var(--line);background:var(--surface);border-radius:.4rem;font-size:.7rem;padding:.15rem .4rem;cursor:pointer;color:var(--ink2)}
.skipb[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.gref>summary{display:flex;gap:.6rem;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}
.gref>summary::-webkit-details-marker{display:none}
.grefgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.7rem;margin-top:.6rem;max-height:15rem;overflow:auto}
.gcol{border:1px solid var(--line);border-radius:.45rem;padding:.5rem .65rem;min-width:0;background:var(--surface)}
.gcol.hot{border-color:var(--accent)}
.gcol h3{display:flex;justify-content:space-between;gap:.5rem;font-size:.82rem;margin:0 0 .3rem}
.gcol ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem;font-size:.85rem}
.gcol li small{display:block;color:var(--ink3);font-size:.7rem}
.rock[data-open="0"] .rbody{display:none}
.rock[data-open="1"] .sum{display:none}
.rock .sum{display:flex;gap:.4rem 1rem;flex-wrap:wrap;color:var(--ink2);font-size:.92rem}
.rock .sum .sw{font-weight:600;color:var(--ink)}
.ochips{display:flex;gap:.3rem;flex-wrap:wrap;min-height:1.4rem}
.ochip{display:inline-flex;gap:.1rem;align-items:center;background:var(--accent-soft);color:var(--ink);border-radius:1rem;padding:.1rem .2rem .1rem .6rem;font-size:.84rem;font-weight:600}
.ochip button{border:0;background:transparent;color:inherit;cursor:pointer;padding:0 .35rem;font-size:1rem;line-height:1}
.rock{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:.5rem;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.6rem;min-width:0}
.rock[data-status=approved]{border-left-color:var(--ok)}
.rock[data-status=rejected]{opacity:.72;border-left-color:var(--bad)}
.rock[data-status=proposed]{border-left-color:var(--gain)}
.rock .rh{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.rock .rt{flex:1 1 14rem;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.1rem;border-color:transparent;background:transparent;padding-left:.2rem}
.rock .rt:hover,.rock .rt:focus{border-color:var(--line);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:.4rem;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:.3rem .65rem;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg button.good[aria-pressed=true]{background:var(--ok);color:var(--surface)}
.seg button.bad[aria-pressed=true]{background:var(--bad);color:var(--surface)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.55rem}
.fld{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.fld>span{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.fld.miss>span{color:var(--warn)}
.fld.miss>input,.fld.miss>select,.fld.miss>textarea{border-color:var(--warn)}
.rock .rf{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--ink2)}
.chip{font-family:var(--f-mono);font-size:.68rem;border-radius:1rem;padding:.1rem .5rem;border:1px solid var(--line);color:var(--ink3);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:.5rem}
table{border-collapse:collapse;width:100%;min-width:44rem}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:.5rem .6rem;background:var(--surface2);border-bottom:1px solid var(--line);font-weight:500}
td{padding:.35rem .5rem;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.ref{color:var(--ink2);font-size:.82rem;min-width:11rem}
td.num{font-variant-numeric:tabular-nums}
td input[type=text]{border-color:transparent;background:transparent}
td input[type=text]:hover,td input[type=text]:focus{border-color:var(--line);background:var(--surface)}
tr.agreed td{background:var(--ok-soft)}

.bars{display:flex;flex-direction:column;gap:.7rem}
.brow{display:grid;grid-template-columns:11rem minmax(0,1fr) 9.5rem;gap:.8rem;align-items:center}
.brow .lb{font-weight:600;font-size:.85rem}
.brow .lb small{display:block;font-weight:400;color:var(--ink3);font-size:.72rem}
.track{position:relative;height:1.35rem;background:var(--surface2);border:1px solid var(--line2);border-radius:.25rem}
.track .zero{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ink3)}
.track .res{position:absolute;top:3px;bottom:3px;background:var(--accent);border-radius:2px}
.track .res.bad{background:var(--bad)}
.track .res.good{background:var(--ok)}
.track .goal{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--gain);border-radius:1px}
.brow .vals{font-family:var(--f-mono);font-size:.76rem;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.brow .vals b{color:var(--ink);font-weight:500}
.legend{display:flex;gap:1rem;font-size:.74rem;color:var(--ink3);flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:.9rem;height:.45rem;border-radius:2px;margin-right:.3rem;vertical-align:middle}
.src{font-family:var(--f-mono);font-size:.68rem;color:var(--ink3);line-height:1.4;overflow-wrap:anywhere}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.7rem .9rem}
.fgrid .wide{grid-column:1/-1}
.fhead{grid-column:1/-1;font-family:var(--f-display);font-stretch:85%;font-size:.98rem;padding-top:.3rem;border-top:1px solid var(--line2)}
.fhead:first-child{border-top:0;padding-top:0}
.pair{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:.4rem}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.7rem}
.pcard{background:var(--surface2);border:1px solid var(--line);border-radius:.5rem;padding:.6rem .7rem;display:flex;flex-direction:column;gap:.45rem;min-width:0}
.pcard h3{font-family:var(--f-display);font-stretch:85%;font-size:1rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.citem{background:var(--surface);border:1px solid var(--line);border-radius:.4rem;padding:.35rem .5rem;font-size:.84rem;display:flex;flex-direction:column;gap:.1rem}
.citem p{white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500}
.citem .m{font-family:var(--f-mono);font-size:.68rem;color:var(--ink3);display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.citem.stop{border-style:dashed}

.steps{display:flex;flex-direction:column;gap:.5rem}
.step{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) auto;gap:.6rem;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:.4rem;padding:.4rem .6rem}
.step[data-v=delete]{opacity:.65}
.step[data-v=delete] .st{text-decoration:line-through}
.step[data-v=addback]{border-color:var(--gain)}
.step .st{overflow-wrap:anywhere;font-weight:500}

.so{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.7rem}
.so .pcard.ok{border-color:var(--ok);background:var(--ok-soft)}

.log{display:flex;flex-direction:column;gap:.5rem}
.dec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.5rem;align-items:start;border-bottom:1px solid var(--line2);padding:.5rem 0}
.dec:last-child{border-bottom:0}
.dec p{overflow-wrap:anywhere;white-space:pre-wrap;font-weight:500}
.dec.done p{text-decoration:line-through;color:var(--ink3)}
.dec .m{font-family:var(--f-mono);font-size:.68rem;color:var(--ink3);display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.1rem}
.dec .m b{color:var(--ink2);font-weight:500}
.dec .m .late{color:var(--bad)}

.rb h3{font-family:var(--f-display);font-stretch:85%;font-size:1rem;margin-bottom:.3rem}
.rb ul{display:flex;flex-direction:column;gap:.3rem}
.rb li{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.rb li b{font-weight:600}
.rb .k{font-family:var(--f-mono);font-size:.7rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.rbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1rem}
.rbsec{border:1px solid var(--line);border-radius:.5rem;padding:.7rem .8rem;background:var(--surface2)}

.ask{position:fixed;right:1rem;top:4rem;width:min(30rem,calc(100vw - 2rem));max-height:calc(100% - 6rem);overflow:auto;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:.7rem;box-shadow:var(--shadow);padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.ask .ans{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface2);border-radius:.4rem;padding:.6rem .7rem;max-height:20rem;overflow:auto}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:.5rem;font-size:.84rem;z-index:30;box-shadow:var(--shadow);max-width:90vw}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:.5rem;padding:.5rem .8rem;font-size:.84rem}
.floaters{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:15}
.fl{position:absolute;bottom:1.5rem;background:var(--accent);color:var(--accent-ink);border-radius:2rem;padding:.35rem .8rem;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);animation:rise 2.6s ease-out forwards}
.fl.q{background:var(--gain);color:var(--surface)}
.fl.p{background:var(--bad);color:var(--surface)}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-14rem);opacity:0}}
@media (prefers-reduced-motion:reduce){.fl{animation:none;opacity:1;bottom:1.5rem}.meter .bar i{transition:none}}

/* ---- polish layer: shape, depth, rhythm. Colors and type come from the tokens above. ---- */
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--bg) var(--bgimg)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::selection{background:var(--accent-soft);color:var(--ink)}

/* headings share one anchor face */
.brand b,.stage h1,.panel h2,.col h3,.rock .rt,.fhead,.pcard h3,.rb h3{font-family:var(--f-display);font-stretch:var(--d-stretch);font-weight:var(--d-wt);letter-spacing:var(--d-track)}
.stage h1{font-weight:var(--d-h1wt);font-size:var(--h1);line-height:var(--h1lh);text-transform:var(--d-case)}
.panel h2{font-size:var(--h2);text-transform:var(--d-case)}
.brand b{font-size:var(--brand);text-transform:var(--brand-case);letter-spacing:.02em;font-weight:var(--d-h1wt)}

/* top bar */
.top{padding:.55rem 1rem;gap:.9rem;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(0,0,0,.35);position:relative;z-index:3}
.brand{gap:.75rem;align-items:center}
.brand .mark{flex:0 0 auto;width:2.2rem;height:2.2rem;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 14px -6px var(--accent)}
.brand .mark svg{width:1.3rem;height:1.3rem}
.brand .name{display:flex;flex-direction:column;gap:.18rem;min-width:0;line-height:1}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(36vw,32rem);color:var(--ink3)}
.who-sel{white-space:nowrap;gap:.5rem}
.who-sel select{min-width:9rem}
.tools{gap:.45rem}
.here{padding:0 .2rem}
.av{box-shadow:0 1px 2px rgba(0,0,0,.25)}

/* buttons */
.btn{border-radius:var(--r);padding:.42rem .78rem;box-shadow:var(--shadow-s);transition:background .12s,border-color .12s,box-shadow .12s,transform .12s}
.btn:hover{border-color:var(--ink3)}
.btn:active{transform:translateY(1px)}
.btn.pri{box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 1px 2px rgba(0,0,0,.25),0 8px 16px -8px var(--accent)}
.btn.pri:hover{filter:none;border-color:var(--accent);transform:translateY(-1px)}
.btn.pri:active{transform:none}
.btn.sm{padding:.3rem .65rem}
.btn.link{box-shadow:none}
.btn.on{box-shadow:inset 0 0 0 1px var(--accent)}

/* form controls */
input,select,textarea{border-radius:var(--r);padding:.48rem .65rem;text-overflow:ellipsis;transition:border-color .12s,box-shadow .12s}
.stage .crow>*{flex-basis:11rem}
input:hover,select:hover,textarea:hover{border-color:var(--ink3)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{-webkit-appearance:none;appearance:none;padding-right:1.9rem;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 1rem) 54%,calc(100% - .7rem) 54%;background-size:.36rem .36rem;background-repeat:no-repeat}
input[type=checkbox]{border-radius:.25rem}
.fld>span,.day-h,.sec-h,.prog h3{letter-spacing:.09em}

/* agenda rail */
.app{grid-template-columns:18.5rem minmax(0,1fr) 22.5rem}
.agenda{padding:.4rem .6rem}
.day-h{display:flex;align-items:center;gap:.6rem;padding:.9rem .5rem .35rem}
.day-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sess{grid-template-columns:3rem minmax(0,1fr) auto;border-radius:var(--r);padding:.5rem .6rem .5rem .8rem;position:relative;transition:background .12s}
.sess .t{display:flex;flex-direction:column;line-height:1.2;padding-top:.08rem}
.sess .t b{font-weight:500;color:var(--ink2)}
.sess .t i{font-style:normal;font-size:.66rem;color:var(--ink3)}
.sess .n{font-size:.88rem}
.sess[aria-current=true]{background:var(--accent-soft)}
.sess[aria-current=true]::before{content:"";position:absolute;left:0;top:.5rem;bottom:.5rem;width:3px;border-radius:2px;background:var(--accent)}
.sess[aria-current=true] .t b{color:var(--accent)}
.sess .tag{border-radius:.25rem}
.brk::before{flex-basis:3rem}
.prog{padding:.9rem 1.1rem 1.1rem;background:var(--surface2)}

/* stage */
.stage{padding:1.7rem clamp(1rem,2.8vw,2.6rem) 3.5rem}
.stage-in{gap:1.3rem}
.kick{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
.kick::before{content:"";flex:0 0 auto;width:.62rem;height:.62rem;background:var(--accent);clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,55% 50%)}
.brief{grid-template-columns:minmax(0,1fr);align-items:start;gap:1.2rem}
.out{position:relative;border:0;border-radius:var(--r-lg);padding:1.05rem 1.25rem 1.15rem 1.9rem;overflow:hidden;box-shadow:var(--shadow);background:radial-gradient(130% 150% at 0% 0%,var(--hl),transparent 60%),var(--gain-soft)}
.out::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.75rem;background:repeating-linear-gradient(135deg,var(--gain) 0 .42rem,transparent .42rem .84rem);opacity:.85}
.out .sec-h{color:var(--gain);margin-bottom:.35rem}
.out p{font-family:var(--f-display);font-weight:var(--d-wt);font-size:1.55rem;line-height:1.22;letter-spacing:0;color:var(--ink)}
.pts{display:block;columns:2 19rem;column-gap:2.4rem}
.pts li{break-inside:avoid;margin-bottom:.7rem}
.pts li{padding-left:1.25rem;font-size:.98rem;line-height:1.5}
.pts li::before{width:.6rem;height:.6rem;top:.5em;border-radius:0;transform:none;background:var(--accent);clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,55% 50%)}

/* cards and panels */
.panel{border-radius:var(--r-lg);padding:1.1rem 1.25rem;gap:.85rem}
.empty{border-radius:var(--r-lg)}
.sticky,.gcard,.citem,.step,.note{box-shadow:var(--shadow-s)}
.sticky{border-radius:var(--r);transition:transform .14s,box-shadow .14s}
.sticky:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.col,.rbsec,.pcard{border-radius:var(--r-lg)}
.gcard,.citem,.step,.tw{border-radius:var(--r)}
.rock{border-radius:var(--r-lg);box-shadow:var(--shadow-s)}
.seg{border-radius:var(--r)}
.chip{padding:.1rem .55rem}
.meter .bar{height:.5rem}
tr{transition:background .1s}
tbody tr:hover td{background:var(--surface2)}
.toast{border-radius:var(--r)}
.ask{border-radius:var(--r-lg)}

/* decision log rail */
.rail-r{background:var(--surface2);gap:1rem}
.rail-r .composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:.9rem;box-shadow:var(--shadow);gap:.65rem}
.dec{border-bottom-color:var(--line)}

/* motion: one staggered reveal when the scene changes */
.stage-in>*{animation:reveal .42s cubic-bezier(.2,.75,.25,1) both}
.stage-in>*:nth-child(2){animation-delay:.04s}
.stage-in>*:nth-child(3){animation-delay:.08s}
.stage-in>*:nth-child(4){animation-delay:.12s}
.stage-in>*:nth-child(5){animation-delay:.16s}
.stage-in>*:nth-child(n+6){animation-delay:.2s}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage-in>*{animation:none}.btn,.sticky{transition:none}}

@media (max-width:1250px){.app{grid-template-columns:15rem minmax(0,1fr) 19rem}}
@media (max-width:1050px){
  .app{grid-template-columns:minmax(0,1fr)}
  .panes{display:flex}
  .rail,.stage{display:none}
  .app[data-pane=stage] .stage{display:block}
  .app[data-pane=agenda] .rail-l{display:flex}
  .app[data-pane=log] .rail-r{display:flex}
  .app.focus .stage{display:block}
  .brief{grid-template-columns:minmax(0,1fr)}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brow{grid-template-columns:minmax(0,1fr);gap:.2rem}
  .brow .vals{text-align:left}
  .step{grid-template-columns:minmax(0,1fr)}
  .rail-r{border-left:0}
}
@media (max-width:560px){.board{grid-template-columns:minmax(0,1fr)}.pair{grid-template-columns:minmax(0,1fr)}}
</style>
